<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Рулетка Пёсдабола</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #8b9aa7);
    --button: var(--tg-theme-button-color, #f28c28);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--hint); font-size: 14px; margin-bottom: 14px; text-align: center; }
  .stage { position: relative; width: min(88vw, 380px); aspect-ratio: 1; }
  .pointer {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%); z-index: 2;
    width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 26px solid #ffd54a; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  svg { width: 100%; height: 100%; display: block; }
  #disc { transform-origin: 50% 50%; transition: transform 6s cubic-bezier(.12,.8,.18,1); }
  .hub { position: absolute; inset: 0; margin: auto; width: 22%; height: 22%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ddd); display: grid; place-items: center;
    font-size: 30px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .result { min-height: 64px; margin-top: 18px; text-align: center; font-size: 22px; font-weight: 700; }
  .result small { display: block; font-size: 14px; font-weight: 400; color: var(--hint); margin-top: 4px; }
  button {
    margin-top: 6px; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 600;
    background: var(--button); color: var(--button-text); cursor: pointer;
  }
  button[hidden] { display: none; }
</style>
</head>
<body>
  <h1>🎡 Рулетка Пёсдабола</h1>
  <div class="sub" id="sub">Загружаю...</div>
  <div class="stage">
    <div class="pointer"></div>
    <svg id="disc" viewBox="-100 -100 200 200"><g id="wheel"></g></svg>
    <div class="hub">🐶</div>
  </div>
  <div class="result" id="result"></div>
  <button id="again" hidden>Пробный спин</button>

<script>
// Порядок секторов должен совпадать с WHEEL в games.py
const SECTORS = [0, 2, 0, 1, 0.5, 3, 0, 1, 0, 0.5, 0, 4];
const COLORS = { 0: "#8e2430", 0.5: "#c8701c", 1: "#5b6b78", 2: "#2e8b57", 3: "#2f6fbf", 4: "#d4a017" };
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const wheel = document.getElementById("wheel");
const disc = document.getElementById("disc");
const step = 360 / SECTORS.length;
const ns = "http://www.w3.org/2000/svg";

function point(angleDeg, r) {
  const a = (angleDeg - 90) * Math.PI / 180;  // 0° — вверху, по часовой стрелке
  return [r * Math.cos(a), r * Math.sin(a)];
}

SECTORS.forEach((mult, i) => {
  const [x1, y1] = point(i * step, 96), [x2, y2] = point((i + 1) * step, 96);
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", `M0 0 L${x1} ${y1} A96 96 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute("fill", COLORS[mult]);
  path.setAttribute("stroke", "#11181f");
  path.setAttribute("stroke-width", "1");
  wheel.appendChild(path);
  const mid = i * step + step / 2;
  const [tx, ty] = point(mid, 68);
  const label = document.createElementNS(ns, "text");
  label.setAttribute("x", tx); label.setAttribute("y", ty);
  label.setAttribute("fill", "#fff"); label.setAttribute("font-size", "13"); label.setAttribute("font-weight", "700");
  label.setAttribute("text-anchor", "middle"); label.setAttribute("dominant-baseline", "middle");
  label.setAttribute("transform", `rotate(${mid} ${tx} ${ty})`);
  label.textContent = "x" + String(mult).replace(".", ",");
  wheel.appendChild(label);
});
const rim = document.createElementNS(ns, "circle");
rim.setAttribute("r", "97"); rim.setAttribute("fill", "none"); rim.setAttribute("stroke", "#ffd54a"); rim.setAttribute("stroke-width", "3");
wheel.appendChild(rim);

let turns = 0;
function spin(sector, onDone) {
  turns += 6;
  // Поворачиваем колесо так, чтобы середина сектора встала под стрелку, плюс небольшой разброс внутри сектора
  const jitter = (Math.random() - 0.5) * step * 0.6;
  const angle = turns * 360 - (sector * step + step / 2) - jitter;
  disc.style.transform = `rotate(${angle}deg)`;
  setTimeout(onDone, 6100);
}

function verdict(stake, mult) {
  const win = Math.floor(stake * mult);
  if (mult === 0) return ["💀 x0", `Минус ${stake}, рулетка сожрала всё`];
  if (mult < 1) return [`😬 x${mult}`.replace(".", ","), `Вернулось ${win} из ${stake}`];
  if (mult === 1) return ["😐 x1", `Остался при своих ${stake}`];
  return [`🤑 x${mult}!`, `Выигрыш ${win}`];
}

const result = document.getElementById("result");
const sub = document.getElementById("sub");
const again = document.getElementById("again");
const param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
  || new URLSearchParams(location.search).get("tgWebAppStartParam") || "";
const match = /^w(\d+)_(\d+)$/.exec(param);

function show(title, note) {
  result.innerHTML = "";
  result.append(title);
  const small = document.createElement("small");
  small.textContent = note;
  result.append(small);
}

if (match && +match[1] < SECTORS.length) {
  const sector = +match[1], stake = +match[2];
  sub.textContent = `Ставка ${stake}. Результат уже решён, смотрим...`;
  setTimeout(() => spin(sector, () => {
    const [title, note] = verdict(stake, SECTORS[sector]);
    show(title, note + ". Итог уже в чате");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(SECTORS[sector] > 1 ? "success" : "error");
  }), 400);
} else {
  sub.textContent = "Крутить на очки: /wheel 50 в группе. Здесь можно попробовать бесплатно";
  again.hidden = false;
}

again.addEventListener("click", () => {
  again.disabled = true;
  result.textContent = "";
  const sector = Math.floor(Math.random() * SECTORS.length);
  spin(sector, () => {
    show(`x${SECTORS[sector]}`.replace(".", ","), "Пробный спин, очки не считаются");
    again.disabled = false;
  });
});
</script>
</body>
</html>
