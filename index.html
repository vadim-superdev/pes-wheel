<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Рулетка Пёсдабола</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #8b9aa7);
    --button: var(--tg-theme-button-color, #f28c28);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--hint); font-size: 14px; margin-bottom: 14px; text-align: center; }
  .stage { position: relative; width: min(88vw, 380px); aspect-ratio: 1; }
  .pointer {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%); z-index: 2;
    width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 26px solid #ffd54a; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  svg { width: 100%; height: 100%; display: block; }
  #disc { transform-origin: 50% 50%; transition: transform 6s cubic-bezier(.12,.8,.18,1); }
  .hub { position: absolute; inset: 0; margin: auto; width: 22%; height: 22%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ddd); display: grid; place-items: center;
    font-size: 30px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .result { min-height: 64px; margin-top: 18px; text-align: center; font-size: 22px; font-weight: 700; }
  .result small { display: block; font-size: 14px; font-weight: 400; color: var(--hint); margin-top: 4px; }
  button {
    margin-top: 6px; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 600;
    background: var(--button); color: var(--button-text); cursor: pointer;
  }
  button[hidden] { display: none; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .buttons[hidden] { display: none; }
</style>
</head>
<body>
  <h1 id="title">🎡 Рулетка Пёсдабола</h1>
  <div class="sub" id="sub">Загружаю...</div>
  <div class="stage">
    <div class="pointer"></div>
    <svg id="disc" viewBox="-100 -100 200 200"><g id="wheel"></g></svg>
    <div class="hub">🐶</div>
  </div>
  <div class="result" id="result"></div>
  <div class="buttons" id="demo" hidden>
    <button id="tryWheel">🎡 Колесо</button>
    <button id="tryCasino">🎰 Казино</button>
  </div>

<script>
// Колесо: порядок секторов должен совпадать с WHEEL в games.py
const WHEEL = [0, 2, 0, 1, 0.5, 3, 0, 1, 0, 0.5, 0, 4];
const WHEEL_COLORS = { 0: "#8e2430", 0.5: "#c8701c", 1: "#5b6b78", 2: "#2e8b57", 3: "#2f6fbf", 4: "#d4a017" };
// Европейская рулетка: порядок чисел на колесе
const CASINO = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
const RED = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
// Коды ставок должны совпадать с CASINO_BETS в games.py
const BET_NAMES = { R: "красное", B: "чёрное", E: "чёт", O: "нечет", L: "1–18", H: "19–36", D1: "1–12", D2: "13–24", D3: "25–36" };

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const wheel = document.getElementById("wheel");
const disc = document.getElementById("disc");
const ns = "http://www.w3.org/2000/svg";
let sectors = [], step = 0, turns = 0;

function point(angleDeg, r) {
  const a = (angleDeg - 90) * Math.PI / 180;  // 0° — вверху, по часовой стрелке
  return [r * Math.cos(a), r * Math.sin(a)];
}

function el(tag, attrs) {
  const node = document.createElementNS(ns, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  wheel.appendChild(node);
  return node;
}

// sectors: [{label, color}]
function build(list, fontSize, labelRadius) {
  sectors = list; step = 360 / list.length;
  wheel.innerHTML = "";
  disc.style.transition = "none"; disc.style.transform = "rotate(0deg)"; turns = 0;
  void disc.offsetWidth;  // применить сброс до включения анимации
  disc.style.transition = "";
  list.forEach((s, i) => {
    const [x1, y1] = point(i * step, 96), [x2, y2] = point((i + 1) * step, 96);
    el("path", { d: `M0 0 L${x1} ${y1} A96 96 0 0 1 ${x2} ${y2} Z`, fill: s.color, stroke: "#11181f", "stroke-width": "0.8" });
    const mid = i * step + step / 2;
    const [tx, ty] = point(mid, labelRadius);
    const label = el("text", { x: tx, y: ty, fill: "#fff", "font-size": fontSize, "font-weight": "700",
      "text-anchor": "middle", "dominant-baseline": "middle", transform: `rotate(${mid} ${tx} ${ty})` });
    label.textContent = s.label;
  });
  el("circle", { r: "97", fill: "none", stroke: "#ffd54a", "stroke-width": "3" });
}

function buildWheel() {
  build(WHEEL.map(m => ({ label: "x" + String(m).replace(".", ","), color: WHEEL_COLORS[m] })), 13, 68);
}

function buildCasino() {
  build(CASINO.map(n => ({ label: String(n), color: n === 0 ? "#1f8a4c" : RED.has(n) ? "#b3202e" : "#1b1b1b" })), 8, 86);
}

function spin(index, onDone) {
  turns += 6;
  // Середина сектора встаёт под стрелку, плюс небольшой разброс внутри сектора
  const jitter = (Math.random() - 0.5) * step * 0.6;
  disc.style.transform = `rotate(${turns * 360 - (index * step + step / 2) - jitter}deg)`;
  setTimeout(onDone, 6100);
}

const result = document.getElementById("result");
const sub = document.getElementById("sub");
const title = document.getElementById("title");
const demo = document.getElementById("demo");

function show(head, note) {
  result.innerHTML = "";
  result.append(head);
  const small = document.createElement("small");
  small.textContent = note;
  result.append(small);
}

function haptic(win) {
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(win ? "success" : "error");
}

function wheelVerdict(stake, mult) {
  const win = Math.floor(stake * mult);
  if (mult === 0) return ["💀 x0", `Минус ${stake}, рулетка сожрала всё`];
  if (mult < 1) return [`😬 x${mult}`.replace(".", ","), `Вернулось ${win} из ${stake}`];
  if (mult === 1) return ["😐 x1", `Остался при своих ${stake}`];
  return [`🤑 x${mult}!`, `Выигрыш ${win}`];
}

function casinoText(n) {
  return `${n === 0 ? "🟢" : RED.has(n) ? "🔴" : "⚫"} ${n}`;
}

function betName(code) {
  return code[0] === "N" ? "число " + code.slice(1) : BET_NAMES[code] || code;
}

const param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
  || new URLSearchParams(location.search).get("tgWebAppStartParam") || "";
const wheelMatch = /^w(\d+)_(\d+)$/.exec(param);
// r<число>_<ставка>_<код ставки>_<выплата>
const casinoMatch = /^r(\d+)_(\d+)_([A-Z]\d*)_(\d+)$/.exec(param);

if (wheelMatch && +wheelMatch[1] < WHEEL.length) {
  const sector = +wheelMatch[1], stake = +wheelMatch[2];
  buildWheel();
  sub.textContent = `Ставка ${stake}. Результат уже решён, смотрим...`;
  setTimeout(() => spin(sector, () => {
    const [head, note] = wheelVerdict(stake, WHEEL[sector]);
    show(head, note + ". Итог уже в чате");
    haptic(WHEEL[sector] > 1);
  }), 400);
} else if (casinoMatch && +casinoMatch[1] <= 36) {
  const n = +casinoMatch[1], stake = +casinoMatch[2], bet = casinoMatch[3], payout = +casinoMatch[4];
  title.textContent = "🎰 Казино Пёсдабола";
  buildCasino();
  sub.textContent = `Ставка ${stake} на ${betName(bet)}. Шарик уже упал, смотрим...`;
  setTimeout(() => spin(CASINO.indexOf(n), () => {
    show(casinoText(n), payout ? `Выигрыш ${payout}! Итог уже в чате` : `Мимо, минус ${stake}. Итог уже в чате`);
    haptic(payout > 0);
  }), 400);
} else {
  buildWheel();
  sub.textContent = "На очки крутят в группе: /wheel 50 или /rulet 50 красное. Здесь можно попробовать бесплатно";
  demo.hidden = false;
}

function trial(isCasino) {
  for (const b of demo.querySelectorAll("button")) b.disabled = true;
  result.textContent = "";
  title.textContent = isCasino ? "🎰 Казино Пёсдабола" : "🎡 Рулетка Пёсдабола";
  isCasino ? buildCasino() : buildWheel();
  const index = Math.floor(Math.random() * sectors.length);
  setTimeout(() => spin(index, () => {
    show(isCasino ? casinoText(CASINO[index]) : `x${WHEEL[index]}`.replace(".", ","), "Пробный спин, очки не считаются");
    for (const b of demo.querySelectorAll("button")) b.disabled = false;
  }), 60);
}
document.getElementById("tryWheel").addEventListener("click", () => trial(false));
document.getElementById("tryCasino").addEventListener("click", () => trial(true));
</script>
</body>
</html>
